org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.useKSP2=true

# Play's production dashboard flags "Optimised resource shrinking isn't
# enabled". Worth 2.32% (4,312,632 -> 4,212,502 bytes).
#
# AGP warns this flag is EXPERIMENTAL, so it was verified on a device rather
# than trusted: Android 9 / 2 GB emulator, no Resources$NotFoundException, no
# InflateException, and the AdMob banner rendered with its image assets intact.
# That banner is the real risk here — a stripped ad resource fails silently and
# costs revenue with nothing in the logs to say so.
#
# 🔴 Re-check the banner after any AGP upgrade. "Experimental" means the
# shrinking algorithm can change under us, and the failure mode is invisible.
android.r8.optimizedResourceShrinking=true
