[versions]
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
agp = "8.13.0"
junit = "5.11.4"
junitPlatform = "1.11.4"
room = "2.8.4"
datastore = "1.2.1"
androidxCore = "1.15.0"
# 1.3.0 / 3.7.0, not the older stable line: Espresso before 3.7.0 calls
# android.hardware.input.InputManager.getInstance(), a hidden API removed in
# Android 16, so every Compose UI test dies with NoSuchMethodException on an
# API 36 device. Confirmed by running them.
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

# Compose. Every version below was confirmed to exist on Google Maven /
# Maven Central before being written here, per CLAUDE.md "verify before adding
# any package" — AI invents package names and attackers pre-register them.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
# NOT the latest. lifecycle 2.10+ requires AGP 9.1 and compileSdk 37; this
# project is on AGP 8.13 / compileSdk 36 because targetSdk must be exactly 36
# for the Play deadline (gap audit §B1). 2.9.4 is the newest release that works
# here. Revisit only alongside an AGP major upgrade, never on its own.
lifecycle = "2.9.4"
navigationCompose = "2.9.8"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# The BOM pins every compose-* version below, so they are declared without one.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
