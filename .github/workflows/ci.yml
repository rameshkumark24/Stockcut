name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two jobs on purpose.
#
# The correctness suite (:units, :optimizer) is pure JVM — no Android SDK, no
# emulator. It is the part that actually guarantees a cut plan is right, so it
# must never be blocked by Android SDK provisioning on the runner. It runs in
# its own job and gates nothing else.
jobs:

  jvm:
    name: Correctness (pure JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # This repo is developed on Windows, where git's core.fileMode is false and
      # the executable bit is never recorded. If gradlew is ever re-added without
      # it, every job here fails in 0s with "Permission denied" and the error
      # looks nothing like its cause. One line, permanently.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test :units and :optimizer
        run: ./gradlew :units:test :optimizer:test

      # CLAUDE.md hard rule 1. Enforced mechanically, not by memory.
      - name: No Android imports in pure modules
        run: |
          if grep -rn "import android" optimizer/src units/src; then
            echo "::error::android.* imported in a pure JVM module (CLAUDE.md rule 1)"
            exit 1
          fi

      # CLAUDE.md hard rule 2. Float/Double are permitted only for wastePercent.
      - name: No floating point in domain code
        run: |
          hits=$(grep -rn --include=*.kt -E "\b(Float|Double)\b" optimizer/src/main units/src/main \
                 | grep -v "wastePercent" | grep -vE ":\s*(//|\*)" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Float/Double outside wastePercent (CLAUDE.md rule 2)"
            exit 1
          fi

      # CLAUDE.md hard rule 2, at the persistence layer. Reads the committed
      # schema JSON, so it needs no Android SDK and belongs in this job.
      - name: No REAL columns in the Room schema
        run: |
          if grep -o '"affinity": "REAL"' data/schemas/*/*.json; then
            echo "::error::REAL column in schema — lengths must be INTEGER (CLAUDE.md rule 2)"
            exit 1
          fi

      # CLAUDE.md hard rule 6. This one call silently deletes every saved job on
      # upgrade, and it is exactly what gets reached for under time pressure.
      # Matches real calls only, not the comments saying it is banned.
      - name: No destructive Room migration
        run: |
          hits=$(grep -rn --include=*.kt "fallbackToDestructiveMigration" data/src \
                 | grep -vE ":\s*(//|\*)" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::fallbackToDestructiveMigration is banned (CLAUDE.md rule 6)"
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/test'

  android:
    name: Android modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the SDK and accepts licences. Without this, AGP cannot download
      # platforms;android-36 and the build fails on a licence prompt it can
      # never answer. compileSdk is 36 because new Play submissions must target
      # API 36 from 31 Aug 2026.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # :app's MeasurementFieldState is deliberately free of Android imports, so
      # the rules that decide what the field accepts are pinned here, on the JVM,
      # rather than only on a device.
      - name: Unit tests (JVM — entitlement rules, seed job, measurement field)
        run: ./gradlew :data:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble the app
        run: ./gradlew :app:assembleDebug

      # Instrumented tests need a device, so at minimum prove they still compile.
      # 🔴 THEY ARE NEVER RUN HERE. Cascade deletes, the CHECK-constraint
      # triggers, migrations, and the MeasurementField blur behaviour are only
      # verified when a human runs, against a device or emulator:
      #   ./gradlew :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      # Do that before any schema change and before any release.
      - name: Compile instrumented tests
        run: ./gradlew :data:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: '**/build/reports/tests/**'
