<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StockCut — Feedback</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  ============================================================================
  THE KILL SWITCH.  Read this before changing anything.
  ============================================================================

  The app links HERE, never at the Google Form directly. That one layer of
  indirection is the only thing in this project that can be changed without
  shipping an app update and waiting days for store review.

  To point feedback somewhere else — the form got flooded, you restructured it,
  you outgrew Google Forms — edit FORM_URL below and commit. Live in a minute.

  🔴 Query parameters MUST be preserved. The app appends the pre-filled
  diagnostics as ?entry.326955045=... and if this page drops them, every report
  arrives without the app version, device and unit mode that make it
  reproducible.

  🔴 FORM_URL must be the PUBLISHED response address, the one containing /d/e/.
  The /forms/d/<id>/viewform form (no /e/) is the editor's document ID — sending
  users there gives them a page they cannot fill in.
  ============================================================================
-->
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 34rem; margin: 4rem auto; padding: 0 1.25rem;
    line-height: 1.6; color: #14181C; background: #F8F9FA;
  }
  a { color: #E8590C; }
  @media (prefers-color-scheme: dark) {
    body { color: #E3E6E8; background: #14181C; }
    a { color: #FF8A3D; }
  }
</style>
<script>
  var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScjT53JvGaGXZRe9PNUNROCiRIPKo8ZCxH_dNBLkl_lf0itSg/viewform";

  // Carry every query parameter through, so the pre-filled diagnostics survive.
  var target = FORM_URL + window.location.search + window.location.hash;
  window.location.replace(target);
</script>
</head>
<body>
  <h1>Opening the feedback form…</h1>
  <!-- Shown only if JavaScript is off or the redirect is slow. -->
  <p>If nothing happens,
    <a id="manual" href="https://docs.google.com/forms/d/e/1FAIpQLScjT53JvGaGXZRe9PNUNROCiRIPKo8ZCxH_dNBLkl_lf0itSg/viewform">open the form directly</a>.</p>
  <script>document.getElementById("manual").href = target;</script>
</body>
</html>
